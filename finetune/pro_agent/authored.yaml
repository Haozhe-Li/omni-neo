  cw-02: |
    Here's a decorator that takes the retryable exception types as its first argument, so anything you don't list propagates immediately.

    ```python
    import functools
    import random
    import time


    def retry(
        exceptions=(Exception,),
        *,
        attempts=5,
        base_delay=0.5,
        max_delay=30.0,
        jitter=1.0,
    ):
        """Retry a call on `exceptions` with exponential backoff and jitter.

        exceptions: tuple of exception types worth retrying. Anything outside
            it is re-raised on the first occurrence.
        attempts:   total tries, including the first one.
        base_delay: seconds before the second attempt; doubles from there.
        max_delay:  ceiling applied before jitter, so backoff cannot run away.
        jitter:     0 disables it; 1.0 is full jitter, i.e. the sleep is drawn
            uniformly from [0, delay]. Full jitter is what actually spreads a
            thundering herd — a fixed delay re-synchronises every caller that
            failed at the same moment.
        """
        if attempts < 1:
            raise ValueError("attempts must be at least 1")

        def decorate(fn):
            @functools.wraps(fn)
            def wrapper(*args, **kwargs):
                for attempt in range(1, attempts + 1):
                    try:
                        return fn(*args, **kwargs)
                    except exceptions:
                        if attempt == attempts:
                            raise
                        delay = min(base_delay * 2 ** (attempt - 1), max_delay)
                        time.sleep(delay * (1 - jitter * random.random()))
            return wrapper

        return decorate
    ```

    Used like this, a timeout or a 5xx gets retried while a bad request fails straight away:

    ```python
    @retry((TimeoutError, ConnectionError), attempts=4, base_delay=0.2)
    def fetch(url):
        ...
    ```

    Two details worth keeping. The re-raise happens on the last attempt rather than after the loop, so the original traceback survives instead of being replaced by a generic "retries exhausted" error. And `functools.wraps` preserves the wrapped function's name and docstring, which matters as soon as something else introspects it — a web framework routing on `fn.__name__`, or a test that asserts on the docstring.

    For async callables you need a parallel `async def` wrapper with `await asyncio.sleep(...)`; `time.sleep` inside a coroutine blocks the whole event loop.
