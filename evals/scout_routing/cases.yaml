# Scout 路由评测集 —— 评的是 core/context_enrichment.py 的「第一轮该做什么」
#
# gold 取值（与 scout prompt 的 7 个 action 对应，两个天气 action 合并为 weather）：
#   web_search | weather | stock | currency | about_omni | direct_response
#
# gold 的定义是「理想行为」，依据 _SCOUT_PROMPT 里写的规则，不是任何一版实现的输出：
#   - 有可核查答案的事实问题 -> web_search（再有名的主体也一样）
#   - 翻译/改写/润色/总结用户给的文本/创作/闲聊/写代码/心算/太模糊 -> direct_response
#   - 加密货币、私有公司、「哪种货币最强」、历史/气候/旅行类天气 -> web_search
#   - 问 Omni 自己（身份/能力/模型/作者/账号/积分/记忆/上传/定时调研）-> about_omni
#
# 字段：
#   q     query 原文
#   gold  期望路由
#   tags  adv  = 专门为难关键词匹配而设计的（字面像 A 类，实际是 B 类）
#         low  = 我对这条 gold 把握不高，换个人标可能不同；报告里可单独排除
#   args  仅 weather/stock/currency：期望的参数（只在 --llm 时用来评参数抽取）
#   ctx   可选，注入 scout 的用户上下文，{location: "..."}；隐式地点（「今天多少度」）用
#
# 这批 query 是人写的，不是线上流量。它能回答「关键词层在哪些句式上会错」，不能回答
# 「线上占比是多少」——后者需要用真实 scout 日志另做一份。

