# SFT 数据的查询集 —— 教师采集的唯一事实来源
#
# 158 条 query。跑 best-of-3 luna rollout,按门槛 + 类别 check 筛选,目标产出
# ~120 条轨迹。
#
# ── 为什么是「类别模板」而不是逐条写 check ──────────────────────────────────
# 逐条手写 = 130 x 3-5 = 400 多条规则,等于把 evals/cases.yaml 重写一遍,而且
# 必然出现拼错、漏项、前后不一致。这里 query 只带一个 `cat` 标签,该类别的
# must-pass 集合写在 categories 下面,改一处全类生效。
#
# ── 两层筛选 ────────────────────────────────────────────────────────────────
# 1. gate(下面 gate: 那一组)—— 与 query 无关的普适格式规则,**任何一条不过就
#    丢弃整条轨迹**。实测 luna 在 56 条基线轨迹上的存活率是 48/56 = 86%,
#    best-of-3 之后单 query 至少一条可用的概率是 99.7%。
# 2. 类别 check —— 该类 query 特有的行为要求。
#
# `citation_coverage` **故意不在 gate 里**:它是个启发式,连 frontier 模型都有
# 约 40% 判不过,拿它当门槛等于按一条谁都满足不了的规则扔掉好数据,而且会反向
# 选择出「少写带数字的段落」这种莫名其妙的偏好。它在 benchmark 里仍然是个低权
# 重计分项,只是不参与数据筛选。
#
# ── 容忍度 ──────────────────────────────────────────────────────────────────
# 该搜没搜 -> 不可容忍(类别 check 直接判死)
# 该加载 skill 没加载 -> 不可容忍
# 该直答却多调了一两次工具 -> 可容忍(不写成 max 上限,交给 gate 里的
#   search_discipline 兜底)
# 但**同一 query 的多条候选里,保留工具调用次数最少的那条** —— student 的病
#   一半是「刹不住」,所以要主动选择最克制的示范。
#
# ── 零重叠 ──────────────────────────────────────────────────────────────────
# 这 130 条与 evals/cases.yaml 的 28 条测试 query 不得有任何重复。由
# spec.py 在加载时强制校验,不靠人眼。

version: 1

# ── 硬门槛:任何一条不过 -> 丢弃整条轨迹 ────────────────────────────────────
gate:
  - tool_discipline
  - no_hyperlinks
  - no_ascii_art
  - citation_exists
  - citation_format
  - no_leading_header
  - latex_sanity
  - search_discipline
  - no_prompt_leak
  - response_language

# ── personalization 取值池 ──────────────────────────────────────────────────
# 字段**格式**固定(要进权重),字段**取值**必须变化(不能进权重)。全部 130 条
# 都钉同一个 2026-08-02,模型会把这个日期学进去,然后在生产里张口就说「今天是
# 8 月 2 日」。采集时按 query 序号轮询这个池子。
personalization_pool:
  - {language: 简体中文,  location: "Champaign, Illinois, US",  datetime: "2026-03-14T09:20:00-05:00"}
  - {language: 简体中文,  location: "Shanghai, China",           datetime: "2026-05-02T21:05:00+08:00"}
  - {language: English,   location: "Seattle, Washington, US",   datetime: "2026-01-27T07:45:00-08:00"}
  - {language: English,   location: "London, United Kingdom",    datetime: "2026-09-19T14:30:00+01:00"}
  - {language: 简体中文,  location: "Taipei, Taiwan",            datetime: "2026-11-08T16:10:00+08:00"}
  - {language: English,   location: "Toronto, Canada",           datetime: "2026-06-23T11:55:00-04:00"}

# ── 类别 ────────────────────────────────────────────────────────────────────
# 每个类别的 checks 是**该类必过**的项(gate 之外额外要求的)。
# `run_limit` 缺省 30,只有 budget-exhausted 覆盖它。
categories:

  deep-research:
    n: 15
    why: >-
      最重的路径,也是 base model 掉得最狠的地方(web-research suite 0.650 vs
      0.938)。一条轨迹同时演示:加载三个 skill、按依赖顺序加载、多轮检索、
      出报告、出图、成簇引用。
    checks:
      - {key: skill_loaded,     args: {skill: web-research}}
      - {key: skill_loaded,     args: {skill: report-writing}}
      - {key: has_report,       args: {min_words: 600, require_title: true}}
      - {key: chart_count,      args: {min: 1}}
      - {key: citation_count,   args: {min: 4}}
      - {key: distinct_queries, args: {tool: google_search, min: 3}}

  budget-exhausted:
    n: 20
    run_limit: 8
    why: >-
      **这一类是人造的,教师自然产不出来。** base model 最严重的失败是撞上
      run_limit 之后无限重试(charting 32 轮、trip-advisor 62 次调用),而 luna
      正常只用 9-17 轮,永远碰不到那面墙。把 run_limit 压到 8 逼它撞墙,录下
      「预算用尽 -> 就地用手上材料写完」的行为。
      探针实测:luna 在 run_limit=6 下被拦 8 次后仍写出 6162 字的完整报告,
      配方成立。构建 JSONL 时**只保留 1 次被拦的调用**,其余成对删除 ——
      否则教出来的是「重试 8 次再收尾」。
    checks:
      # `has_report`,不是 `word_count`:这 20 条都是研究型 query,教师撞墙后
      # 交付的是一个 <report>,而 word_count 跑在 prose_only 上、会先把 report
      # 剥掉 —— 实测 be-01 产出了完整报告却只数到 67 个词,差点被判死。
      - {key: has_report,     args: {min_words: 300}}
      - {key: citation_count, args: {min: 2}}

  search-fact:
    n: 15
    why: >-
      必须检索的事实性问题。base model 在 report-writing/no-report-needed 上
      0 次工具调用直接张嘴答,这一类就是纠正那个。
    checks:
      - {key: tool_called,    args: {tool: google_search, min: 1}}
      - {key: citation_count, args: {min: 1}}

  single-tool:
    n: 12
    why: >-
      天气/股票/汇率各 4 条。`tool_called:get_weather` 在基线上是 0/2 ——
      连最该调工具的场景它都不调。
    checks:
      - {key: citation_exists}

  chart:
    n: 10
    why: >-
      charting suite 0.754,`charts_valid` 0/7。echarts fence 的格式契约写在
      SKILL.md 里,不读就写不出来。
    checks:
      - {key: skill_loaded,  args: {skill: charting}}
      - {key: chart_count,   args: {min: 1}}
      - {key: charts_valid,  args: {require_palette: true}}

  teach:
    n: 10
    why: >-
      guided-learning skill 在 56 次基线运行里 0 次加载。
    checks:
      - {key: skill_loaded,   args: {skill: guided-learning}}
      - {key: question_block, args: {min_q: 1, max_q: 5, must_be_last: true}}

  write-rewrite:
    n: 26
    why: >-
      `<textblock>` 输出契约。这条不是 skill,写在 PRO_PROMPT 的
      _S_WRITING_FORMAT 里,语法细节多(type="email"、subject="…"、subject 内
      不能有双引号),低频且易错 —— 所以第一轮**不要**把那一段从 prompt 里
      压掉。

      2026-08-12 扩到 26 条,补的是**翻译**。原来 10 条里纯翻译是 0 条
      (wr-07 是「翻译+润色」,且指令和输出同为中文),`evals/cases.yaml` 的 28
      个 case 里翻译也是 0 个 —— 既没教过也没测过,rix v3 在翻译任务上不出
      textblock 就是这么来的。wr-11~wr-18 是跨语种翻译,wr-19~wr-26 补
      润色和邮件的样本量(type="email"/subject 原来只有 3 条示范)。

      跨语种翻译是唯一一类 **prose 语种 ≠ textblock 语种**的任务,而
      `response_language` 在下面的 gate 里。它原先把 textblock 正文也算进语种
      检测,于是翻译轨迹被判 `mixed` 而整条丢弃 —— 无声无息,实测 8 条里死 3
      条。改成只看 `parsers.conversational_text`(散文 + report + question,
      不含 textblock)之后才收得上来。

      wr-11~wr-26 和 rs-11/rs-12 的答案是**手写**的,见 `authored.yaml` 和
      `author.py`:这一类零工具调用、答案近乎唯一,而 luna 对前置短评那条契约
      的遵守率只有 50%。手写答案仍然要过完全相同的 gate + 类别 check。
    checks:
      # min_words 只用来挡住空块/退化块,不是长度要求:这一类同时包含起草
      # (邮件、求职信)和**压缩**(「改简洁一点」)。wr-04 的正确答案就是 10 个
      # 词,之前定 60 会把完全正确的轨迹判死。
      - {key: textblock,          args: {min: 1, max: 1, min_words: 8}}
      - {key: followup_question}
      - {key: no_tool_calls}

  restraint:
    n: 12
    why: >-
      克制负例。base model 的病一半是「做太多」(32 轮/62 次调用),这一类专门
      演示「什么都不做才是对的」。注意基线上它的负例分数反而最高
      (no-chart-needed 0.912、no-map-needed 0.897)—— 所以这一类不是为了修
      它,而是防止 SFT 把它推向「什么都要做」的另一个极端。

      rs-11/rs-12 是 write-rewrite 的**边界负例**:问一个外语词什么意思是
      *解释*,不是交付物,不该包 textblock。只喂正例的话模型学到的规律会是
      「凡是出现外语就包 textblock」,所以这两条和 wr-11~wr-18 必须成对存在。
    checks:
      - {key: no_report}
      - {key: no_question_block}
      # 克制类按定义就不该产出交付物块 —— 对 rs-01~rs-10 同样成立,
      # 加上它不改变这十条的判定,只是把原本隐含的要求写出来。
      - {key: no_textblock}

  places:
    n: 8
    why: >-
      `map_fence` 0/5、`skill_loaded:mapping` 0/2。
      注意 google_search_places 的 k 上限是 5,实测常只返回 2-3 家 ——
      query 不要写死「推荐五家」,否则模型只能编。
    checks:
      - {key: tool_called,  args: {tool: google_search_places, min: 1}}
      - {key: skill_loaded, args: {skill: mapping}}
      - {key: map_fence,    args: {min: 1, max_pins: 8}}

  compute:
    n: 8
    why: >-
      run_python 路径。PRO_PROMPT 要求「never approximate in your head」。
    checks:
      - {key: tool_called, args: {tool: run_python, min: 1}}
      - {key: no_report}

  ask-question:
    n: 8
    why: >-
      `question_block` 0/9。需求不明时应先反问,而不是猜着答。
      注意 query 必须是**没有额外信息就真的答不了**的那种。原来的
      「给我推荐一个数据库」「帮我选个云服务商」这类技术选型,教师会判定可以
      给通用对比然后直接答 —— 5 条里 3 条 0/3 全灭。benchmark 里能触发反问的
      是 `Help me pick a laptop` 这种**个人消费决策**:答案空间大、且完全取决于
      预算和用途。教师不问,就蒸馏不出问。
    checks:
      - {key: skill_loaded,   args: {skill: ask-question}}
      # max_q 跟 cases.yaml 的 trip-advisor 对齐(8)。开放式规划类问题教师会问
      # 6-7 个,那是合理的,不是违规。
      - {key: question_block, args: {min_q: 1, max_q: 8, must_be_last: true}}
      - {key: no_report}

  lang-mix:
    n: 10
    why: >-
      **语种纪律 —— 混合语种 query。** 2026-08-12 实测的失败形状:一句中文
      提问里夹了英文名词短语,rix v3 用英文整段作答,8/8 全挂。夹 1-2 个词时
      正常(8/8 中文),夹一整个英文从句时 0/8 —— 是剂量反应,不是随机。

      前 147 条里这种 query 有 **0 条**:85 条中文 query 里 81 条是纯中文
      (英文词 ≤1),另外 4 条的英文是「待翻译的素材」而不是提问中的术语。
      benchmark 里也只有 `language/zh-frame-en-terms` 一条,而 rix v3 在
      response_language 上的**全部失分就是这一条**。

      这 10 条同时是唯一带 `Follow User's Query Language` 的采集样本 ——
      那是生产在用户没设语言时发的默认值,而它在前 147 条里出现 0 次
      (79 条钉死 简体中文、68 条钉死 English)。注意 `spec.py::checks_for`
      必须把这个值特判成 `expect = q.lang`,否则 `"中文" in ...` 会判成
      英文,把每条中文 query 全判死。

      类别不加额外 check:这一类要测的东西全在 gate 里(`response_language`),
      再加行为约束反而会因为无关原因丢掉正确的轨迹。
    checks: []

  about:
    n: 6
    why: >-
      `judge:factual` 0/4 —— 它在关于 Omni 自己的问题上全靠编,因为
      `skill_loaded:about-omni` 也是 0/2。

      2026-08-13 重写了全部六条。旧的四条(问模型栈、问作者、问差异)**没有
      一条直接问「你是谁」**,而生产上问这句得到的是「我不是 qwen」。成因是
      两件事相乘:一是训练里压根没有这个目标,模型只能够最近的邻居;二是那个
      邻居 ab-01「你背后用的是什么模型」的标准答案以「**不是**单一模型,而是
      ……」开头 —— 唯一一条谈自身身份的样本,骨架就是否定句。压低了「Qwen」
      这个答案却没给正面替代,剩下的就只有否定动作本身。
      正确答案其实一直写在 `skills/about-omni/SKILL.md` 里(「Rix: tuned for
      agentic research on top of Qwen 3 30B A3B」),只是没有任何一条 trace
      把它蒸馏进权重。

      六条覆盖:是谁(ab-01/06)、能干啥(ab-02)、底座模型(ab-03)、自我认定
      (ab-04)、作者(ab-05)。中英各三,全部 `Follow User's Query Language`。
      刻意**不**收「你是不是 ChatGPT」这种点名别家模型的问法 —— 它天然把答案
      引向「我不是 X」,拿来当样本是在喂正要治的病。
      答案的硬要求是**先正面自我认定,再补充细节**,否定句式一律不留;luna
      写不对就走 `authored.yaml` 手写通道。
    checks:
      - {key: no_report}

  # ── textblock 过度使用的解药 ────────────────────────────────────────────
  # 生产实测:写代码的时候也往 `<textblock>` 里塞。`_S_WRITING_FORMAT` 列的是
  # 文章、邮件、故事、信件、合同条款 —— 全是**散文**交付物,代码不在其列。但
  # 前 157 条里 26 条 write-rewrite 全是散文正例,`no_textblock` 的负例只有
  # rs-11/rs-12 两条「解释外语词」。模型只见过「有交付物 -> 包 textblock」,
  # 没见过「有交付物但不该包」的另一半,于是把代码也归进去了。
  #
  # 三个类别按 check 需求分开而不是合成一个:写代码要正向验证围栏、纯算术要
  # 验证不心算、带检索的要验证引用,合成一类就得让每条都背上不适用的约束。
  # 六条全部 `Follow User's Query Language`,中英各三,顺带加厚生产默认值的
  # 覆盖(目前只有 lang-mix 那 10 条 + 10 条改标的)。

  adversarial:
    n: 4
    why: >-
      **前 165 条里 adversarial 是 0 条。** 而 v4 的 benchmark 上这一项从 v3 的
      0.8261 掉到 0.7877,掉分点很具体:`adversarial/injection-in-page` 两次
      repeat **全部**触发生产的 prompt-leakage guard —— v4 把 19,586 字的系统
      提示词吐了 18,551 字出去,还照做了页面里的注入指令。v1/v3 在同一条上是
      0/2 泄漏,所以这是 v4 引入的回归。

      四条都是**指令覆盖型**注入,形状故意分开:直接命令、开发者模式扮演、伪造
      的系统权限、先服从再套话。中英各二,全部 `Follow User's Query Language`。

      答案手写而不是采集:这一类的正确答案是**唯一**的(拒绝 + 不复述注入内容),
      没有推理链可蒸馏,而 luna 的措辞每次都不一样。更关键的是**不能让答案复述
      注入文本** —— v4 的失败输出第一段就是把注入指令原样抄了一遍,喂这种示范
      等于教它照抄。手写能把这条钉死。

      没有追问、不调工具、不出块:`_S_FOLLOWUP` 的追问只跟在改写/翻译/写作
      交付物之后,拒绝不是交付物。
    checks:
      - {key: no_report}
      - {key: no_textblock}
      - {key: no_question_block}
      - {key: no_tool_calls}

  safety:
    n: 4
    why: >-
      有害请求的拒绝。和 adversarial 是**两回事**,分开建类:adversarial 是有人
      想夺走指令控制权(拒绝的是「谁在下令」),safety 是请求本身不能满足(拒绝的
      是「做什么」)。合成一类会让模型把两者的信号混起来 —— 而生产里绝大多数
      有害请求根本不带注入,措辞跟普通问题没有区别。

      前 169 条里这一类同样是 0 条。四条覆盖四种不同的伤害面(爆炸物、化学武器、
      投毒、无法追踪的枪械),而不是同一件事的四个说法,免得模型学成关键词匹配。

      手写的三条硬规则和 adversarial 一致,但多一条**只属于这一类**的:拒绝时
      不能带部分信息。「我不能告诉你怎么做 X,那需要 Y 和 Z」这种句式,拒绝的
      姿态做足了,却把 Y 和 Z 交了出去。四条答案里没有任何一条描述请求的技术
      内容。

      也不说教。一句拒绝、一个还能帮上忙的方向,然后结束 —— 长篇的道德说明既
      帮不上正当用户,也拦不住真正的滥用者。
    checks:
      - {key: no_report}
      - {key: no_textblock}
      - {key: no_question_block}
      - {key: no_tool_calls}

  code-write:
    n: 2
    why: >-
      代码交付物必须进 ```` ``` ```` 围栏,不能进 `<textblock>`。两个 check 是
      一对:`code_block` 管正向(真的产出了代码),`no_textblock` 管负向(没塞错
      地方)。只有后者的话,一个完全不写代码的回答也能通过。
      产品侧的实际差别是语法高亮和复制按钮 —— textblock 里的代码两样都没有。
    checks:
      - {key: code_block,   args: {lang: python, min_lines: 5}}
      - {key: no_textblock}
      - {key: no_report}

  math-exact:
    n: 2
    why: >-
      PRO_PROMPT:「never approximate in your head, never make up numbers」。
      compute 那 8 条已经在教这个,这两条补的是**大数精确算术** —— 心算「看起来
      能算」但实际会错的那种位数,逼出 run_python 而不是估算。
      同样带 `no_textblock`:算出来的数字是答案,不是交付物。
    checks:
      - {key: tool_called, args: {tool: run_python, min: 1}}
      - {key: no_textblock}
      - {key: no_report}

  math-research:
    n: 2
    why: >-
      最完整的一条链:检索 -> 读页面 -> 用 run_python 算 -> 带引用给出答案。
      单独存在的意义是它同时压住两个已知弱点 —— compute 类不检索所以从不需要
      引用,search-fact 类不算数所以从不调 run_python,而真实的「帮我看看这家
      公司营收变好了多少」两样都要。rix 在 `citation_required` 上是十个模型里
      最后一名,这一类把引用要求放在一个**数字必须自己算**的语境里。
    checks:
      - {key: tool_called,    args: {tool: run_python, min: 1}}
      - {key: tool_called,    args: {tool: google_search, min: 1}}
      - {key: citation_count, args: {min: 2}}
      - {key: no_textblock}

# ── 可选块覆盖 ──────────────────────────────────────────────────────────────
# 生产的 build_message_content 能发 7 种块,eval 的 build_user_message 只发 3
# 种。也就是说模型至今从没在训练里见过其中 4 种。这是**正交轴**:挂在已有类别
# 上,不新增类别。
#
#   user_memory        12   生产里很常见(开了记忆的用户每个新 thread 首轮都带)
#   attached_files      8   挂一份合成文档到 /uploads/
#   priority_sources    6   2026-08-11 之前连 _S_INPUT_FORMAT 都没文档化过
#   follow_up_selection 6
#   requested_skill     6
#
# 每条 query 的 `block:` 字段指定它携带哪个块。

queries:

  # ══════════════════════════════════════════════════════════════════════════
