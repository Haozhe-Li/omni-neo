# SFT 数据的查询集 —— 教师采集的唯一事实来源
#
# 130 条 query。跑 best-of-3 luna rollout,按门槛 + 类别 check 筛选,目标产出
# ~100 条轨迹。
#
# ── 为什么是「类别模板」而不是逐条写 check ──────────────────────────────────
# 逐条手写 = 130 x 3-5 = 400 多条规则,等于把 evals/cases.yaml 重写一遍,而且
# 必然出现拼错、漏项、前后不一致。这里 query 只带一个 `cat` 标签,该类别的
# must-pass 集合写在 categories 下面,改一处全类生效。
#
# ── 两层筛选 ────────────────────────────────────────────────────────────────
# 1. gate(下面 gate: 那一组)—— 与 query 无关的普适格式规则,**任何一条不过就
#    丢弃整条轨迹**。实测 luna 在 56 条基线轨迹上的存活率是 48/56 = 86%,
#    best-of-3 之后单 query 至少一条可用的概率是 99.7%。
# 2. 类别 check —— 该类 query 特有的行为要求。
#
# `citation_coverage` **故意不在 gate 里**:它是个启发式,连 frontier 模型都有
# 约 40% 判不过,拿它当门槛等于按一条谁都满足不了的规则扔掉好数据,而且会反向
# 选择出「少写带数字的段落」这种莫名其妙的偏好。它在 benchmark 里仍然是个低权
# 重计分项,只是不参与数据筛选。
#
# ── 容忍度 ──────────────────────────────────────────────────────────────────
# 该搜没搜 -> 不可容忍(类别 check 直接判死)
# 该加载 skill 没加载 -> 不可容忍
# 该直答却多调了一两次工具 -> 可容忍(不写成 max 上限,交给 gate 里的
#   search_discipline 兜底)
# 但**同一 query 的多条候选里,保留工具调用次数最少的那条** —— student 的病
#   一半是「刹不住」,所以要主动选择最克制的示范。
#
# ── 零重叠 ──────────────────────────────────────────────────────────────────
# 这 130 条与 evals/cases.yaml 的 28 条测试 query 不得有任何重复。由
# spec.py 在加载时强制校验,不靠人眼。

version: 1

# ── 硬门槛:任何一条不过 -> 丢弃整条轨迹 ────────────────────────────────────
gate:
  - tool_discipline
  - no_hyperlinks
  - no_ascii_art
  - citation_exists
  - citation_format
  - no_leading_header
  - latex_sanity
  - search_discipline
  - no_prompt_leak
  - response_language

# ── personalization 取值池 ──────────────────────────────────────────────────
# 字段**格式**固定(要进权重),字段**取值**必须变化(不能进权重)。全部 130 条
# 都钉同一个 2026-08-02,模型会把这个日期学进去,然后在生产里张口就说「今天是
# 8 月 2 日」。采集时按 query 序号轮询这个池子。
personalization_pool:
  - {language: 简体中文,  location: "Champaign, Illinois, US",  datetime: "2026-03-14T09:20:00-05:00"}
  - {language: 简体中文,  location: "Shanghai, China",           datetime: "2026-05-02T21:05:00+08:00"}
  - {language: English,   location: "Seattle, Washington, US",   datetime: "2026-01-27T07:45:00-08:00"}
  - {language: English,   location: "London, United Kingdom",    datetime: "2026-09-19T14:30:00+01:00"}
  - {language: 简体中文,  location: "Taipei, Taiwan",            datetime: "2026-11-08T16:10:00+08:00"}
  - {language: English,   location: "Toronto, Canada",           datetime: "2026-06-23T11:55:00-04:00"}

# ── 类别 ────────────────────────────────────────────────────────────────────
# 每个类别的 checks 是**该类必过**的项(gate 之外额外要求的)。
# `run_limit` 缺省 30,只有 budget-exhausted 覆盖它。
categories:

  deep-research:
    n: 15
    why: >-
      最重的路径,也是 base model 掉得最狠的地方(web-research suite 0.650 vs
      0.938)。一条轨迹同时演示:加载三个 skill、按依赖顺序加载、多轮检索、
      出报告、出图、成簇引用。
    checks:
      - {key: skill_loaded,     args: {skill: web-research}}
      - {key: skill_loaded,     args: {skill: report-writing}}
      - {key: has_report,       args: {min_words: 600, require_title: true}}
      - {key: chart_count,      args: {min: 1}}
      - {key: citation_count,   args: {min: 4}}
      - {key: distinct_queries, args: {tool: google_search, min: 3}}

  budget-exhausted:
    n: 20
    run_limit: 8
    why: >-
      **这一类是人造的,教师自然产不出来。** base model 最严重的失败是撞上
      run_limit 之后无限重试(charting 32 轮、trip-advisor 62 次调用),而 luna
      正常只用 9-17 轮,永远碰不到那面墙。把 run_limit 压到 8 逼它撞墙,录下
      「预算用尽 -> 就地用手上材料写完」的行为。
      探针实测:luna 在 run_limit=6 下被拦 8 次后仍写出 6162 字的完整报告,
      配方成立。构建 JSONL 时**只保留 1 次被拦的调用**,其余成对删除 ——
      否则教出来的是「重试 8 次再收尾」。
    checks:
      # `has_report`,不是 `word_count`:这 20 条都是研究型 query,教师撞墙后
      # 交付的是一个 <report>,而 word_count 跑在 prose_only 上、会先把 report
      # 剥掉 —— 实测 be-01 产出了完整报告却只数到 67 个词,差点被判死。
      - {key: has_report,     args: {min_words: 300}}
      - {key: citation_count, args: {min: 2}}

  search-fact:
    n: 15
    why: >-
      必须检索的事实性问题。base model 在 report-writing/no-report-needed 上
      0 次工具调用直接张嘴答,这一类就是纠正那个。
    checks:
      - {key: tool_called,    args: {tool: google_search, min: 1}}
      - {key: citation_count, args: {min: 1}}

  single-tool:
    n: 12
    why: >-
      天气/股票/汇率各 4 条。`tool_called:get_weather` 在基线上是 0/2 ——
      连最该调工具的场景它都不调。
    checks:
      - {key: citation_exists}

  chart:
    n: 10
    why: >-
      charting suite 0.754,`charts_valid` 0/7。echarts fence 的格式契约写在
      SKILL.md 里,不读就写不出来。
    checks:
      - {key: skill_loaded,  args: {skill: charting}}
      - {key: chart_count,   args: {min: 1}}
      - {key: charts_valid,  args: {require_palette: true}}

  teach:
    n: 10
    why: >-
      guided-learning skill 在 56 次基线运行里 0 次加载。
    checks:
      - {key: skill_loaded,   args: {skill: guided-learning}}
      - {key: question_block, args: {min_q: 1, max_q: 5, must_be_last: true}}

  write-rewrite:
    n: 10
    why: >-
      `<textblock>` 输出契约。这条不是 skill,写在 PRO_PROMPT 的
      _S_WRITING_FORMAT 里,语法细节多(type="email"、subject="…"、subject 内
      不能有双引号),低频且易错 —— 所以第一轮**不要**把那一段从 prompt 里
      压掉。
    checks:
      # min_words 只用来挡住空块/退化块,不是长度要求:这一类同时包含起草
      # (邮件、求职信)和**压缩**(「改简洁一点」)。wr-04 的正确答案就是 10 个
      # 词,之前定 60 会把完全正确的轨迹判死。
      - {key: textblock,          args: {min: 1, max: 1, min_words: 8}}
      - {key: followup_question}
      - {key: no_tool_calls}

  restraint:
    n: 10
    why: >-
      克制负例。base model 的病一半是「做太多」(32 轮/62 次调用),这一类专门
      演示「什么都不做才是对的」。注意基线上它的负例分数反而最高
      (no-chart-needed 0.912、no-map-needed 0.897)—— 所以这一类不是为了修
      它,而是防止 SFT 把它推向「什么都要做」的另一个极端。
    checks:
      - {key: no_report}
      - {key: no_question_block}

  places:
    n: 8
    why: >-
      `map_fence` 0/5、`skill_loaded:mapping` 0/2。
      注意 google_search_places 的 k 上限是 5,实测常只返回 2-3 家 ——
      query 不要写死「推荐五家」,否则模型只能编。
    checks:
      - {key: tool_called,  args: {tool: google_search_places, min: 1}}
      - {key: skill_loaded, args: {skill: mapping}}
      - {key: map_fence,    args: {min: 1, max_pins: 8}}

  compute:
    n: 8
    why: >-
      run_python 路径。PRO_PROMPT 要求「never approximate in your head」。
    checks:
      - {key: tool_called, args: {tool: run_python, min: 1}}
      - {key: no_report}

  ask-question:
    n: 8
    why: >-
      `question_block` 0/9。需求不明时应先反问,而不是猜着答。
      注意 query 必须是**没有额外信息就真的答不了**的那种。原来的
      「给我推荐一个数据库」「帮我选个云服务商」这类技术选型,教师会判定可以
      给通用对比然后直接答 —— 5 条里 3 条 0/3 全灭。benchmark 里能触发反问的
      是 `Help me pick a laptop` 这种**个人消费决策**:答案空间大、且完全取决于
      预算和用途。教师不问,就蒸馏不出问。
    checks:
      - {key: skill_loaded,   args: {skill: ask-question}}
      # max_q 跟 cases.yaml 的 trip-advisor 对齐(8)。开放式规划类问题教师会问
      # 6-7 个,那是合理的,不是违规。
      - {key: question_block, args: {min_q: 1, max_q: 8, must_be_last: true}}
      - {key: no_report}

  about:
    n: 4
    why: >-
      `judge:factual` 0/4 —— 它在关于 Omni 自己的问题上全靠编,因为
      `skill_loaded:about-omni` 也是 0/2。
    checks:
      - {key: no_report}

# ── 可选块覆盖 ──────────────────────────────────────────────────────────────
# 生产的 build_message_content 能发 7 种块,eval 的 build_user_message 只发 3
# 种。也就是说模型至今从没在训练里见过其中 4 种。这是**正交轴**:挂在已有类别
# 上,不新增类别。
#
#   user_memory        12   生产里很常见(开了记忆的用户每个新 thread 首轮都带)
#   attached_files      8   挂一份合成文档到 /uploads/
#   priority_sources    6   2026-08-11 之前连 _S_INPUT_FORMAT 都没文档化过
#   follow_up_selection 6
#   requested_skill     6
#
# 每条 query 的 `block:` 字段指定它携带哪个块。

queries:

