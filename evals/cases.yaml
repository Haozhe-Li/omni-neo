# ═══════════════════════════════════════════════════════════════════════════
# general — 不针对任何 skill 的普通 query
# ═══════════════════════════════════════════════════════════════════════════
  - id: general/weather-tomorrow
    suite: general
    title: 明日天气应走 forecast
    lang: en
    personalization: {language: English}
    turns:
      - text: Will it rain in San Francisco tomorrow?
    checks:
      - {key: tool_called, args: {tool: get_weather_forecast, min: 1, max: 2}, weight: 3}
      - {key: word_count,  args: {min: 20, max: 300}, weight: 2}
      - {key: no_report,   weight: 2}
      - {key: chart_count, args: {max: 0}}
    judge:
      - key: answers_question
        weight: 3
        prompt: >-
          Does it state a direct conclusion on whether it will rain tomorrow, rather than only listing weather data?

  - id: general/stock-price
    suite: general
    title: 股价查询
    turns:
      - text: 英伟达现在股价多少?
    checks:
      - {key: tool_called, args: {tool: get_stock_data, min: 1, max: 2}, weight: 3}
      - {key: word_count,  args: {min: 15, max: 300}, weight: 2}
      - {key: no_report,   weight: 2}
    judge:
      - key: number_from_tool
        weight: 3
        prompt: >-
          Does the share price in the answer match what get_stock_data returned? A mismatch means it was fabricated — score 0.

  - id: general/birthday-paradox
    suite: general
    title: 概率计算必须跑代码
    lang: en
    personalization: {language: English}
    turns:
      - text: In a class of 40 people, what's the probability that at least two share a birthday?
    checks:
      - {key: tool_called, args: {tool: run_python, min: 1, max: 3}, weight: 3}
      - {key: latex_sanity, weight: 2}
      - {key: no_report,   weight: 2}
    judge:
      - key: numeric_correct
        weight: 3
        prompt: >-
          Is the final probability approximately 0.891 (89.1%)? Score 0 if it is off by more than one percentage point.
      - key: no_mental_math
        weight: 3
        prompt: >-
          Did the number actually come from the run_python output, rather than being computed mentally with a code block added afterwards? Score 0 if the code's output and the prose figure disagree.

  - id: general/resignation-email
    suite: general
    title: 写作任务的格式契约
    turns:
