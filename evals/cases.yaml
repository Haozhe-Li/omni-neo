  - id: general/birthday-paradox
    suite: general
    title: 概率计算必须跑代码
    lang: en
    personalization: {language: English}
    turns:
      - text: In a class of 40 people, what's the probability that at least two share a birthday?
    checks:
      - {key: tool_called, args: {tool: run_python, min: 1, max: 3}, weight: 3}
      - {key: latex_sanity, weight: 2}
      - {key: no_report,   weight: 2}
    judge:
      - key: numeric_correct
        weight: 3
        prompt: >-
          Is the final probability approximately 0.891 (89.1%)? Score 0 if it is off by more than one percentage point.
      - key: no_mental_math
        weight: 3
        prompt: >-
          Did the number actually come from the run_python output, rather than being computed mentally with a code block added afterwards? Score 0 if the code's output and the prose figure disagree.

  - id: general/resignation-email
    suite: general
    title: 写作任务的格式契约
    turns:
      - text: 帮我写一封辞职邮件,语气客气一点
    # 这个 case 之前用 `has_delimiters`(找 `---` 水平线)判产物,而 PRO_PROMPT
    # 早就改成 `<textblock type="email" subject="…">`,`_S_FORMATTING_PRO` 还
    # 明确说「用标题而不是水平线分节」。也就是说:**完全按 prompt 行事的模型
    # 会在这里丢掉 weight 3 + judge weight 3**。因为这个 case 不在 smoke 集里,
    # 所有历史测量都没照到它。
    #
    # `word_count` 现在只量正文之外的评语 —— `prose_only` 会把 textblock 剥掉
    # (和 report 一视同仁),交付物本身的长度由 textblock 的 min/max_words 管。
    checks:
      - {key: textblock,          args: {min: 1, max: 1, require_type: email,
                                         min_words: 60, max_words: 400}, weight: 3}
      - {key: followup_question,  weight: 3}
      - {key: tool_called,        args: {tool: google_search, min: 0, max: 0}, weight: 2}
      - {key: no_report,          weight: 2}
      - {key: word_count,         args: {min: 5, max: 80}}
    disable: [citation_exists, citation_format]
    judge:
      - key: tone
        weight: 2
        prompt: >-
          Is the email's tone polite and appropriate enough to send as-is?
      - key: separation
        weight: 3
        prompt: >-
          Does it cleanly separate its own remarks from the deliverable (one short line of commentary, the email inside a single <textblock> block, then one follow-up question)? Score 0 if the same email text also appears in plain chat text outside the block.

  - id: general/chitchat
