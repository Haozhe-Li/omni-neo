# Omni evaluation — 全部测试用例与评分标准
#
# 这是评测的唯一事实来源。Python 侧只实现 check 的**类型**(怎么判),
# 所有的 query、阈值、权重、judge 提问都在这里,改评测标准 = 改这个文件,
# 不用动代码。字数下限这类东西每个 query 本就不同,全部逐 case 可配。
#
# ── check 契约 ──────────────────────────────────────────────────────────────
#   - {key: <check 类型>, args: {...}, weight: <权重>, turn: <0|1|last|any>}
#
# weight 缺省 1。weight >= 2 的算「硬性项」,计入 pass_rate。
# turn 缺省 "last"(只看最后一轮的回答);多轮 case 才需要显式指定。
#
# ── check 类型全表 ──────────────────────────────────────────────────────────
# skill 触发
#   skill_loaded         {skill}            trace 里有 read_file("/skills/<skill>/SKILL.md")
#   skill_not_loaded     {skill}            反向,用于负例
#   skill_load_order     {before, after}    before 的读取早于 after
# 工具
#   tool_called          {tool, min, max}   调用次数落在 [min, max]
#   no_tool_calls        {}                 一次工具都没调
#   distinct_queries     {tool, min}        去重后的不同查询数(防同一 query 刷次数)
#   distinct_domains     {min}              load_web_page 命中的不同域名数
#   search_discipline    {max_per_topic}    同一 sub-topic 的 google_search 上限
# 产物
#   has_report           {min_words, max_words, require_title}
#   no_report            {}
#   chart_count          {min, max}
#   charts_valid         {require_palette, min_series}
#   map_fence            {min, max_pins}
#   no_map               {}
#   question_block       {min_q, max_q, must_be_last}
#   no_question_block    {}
#   has_delimiters       {}                 写作类:--- 包裹正文
#   followup_question    {}                 写作类:结尾一个追问
# 格式(全部对应 core/agent.py PRO_PROMPT 里的硬约束)
#   word_count           {min, max}         CJK 感知
#   citation_count       {min}              不同 [n] 的个数
#   citation_exists      {}                 每个 [n] 都在本轮 registry 里(抓幻觉引用)
#   citation_format      {}                 ASCII 括号、成簇在段末、不在句中
#   citation_coverage    {min_ratio}        含工具事实的段落里带引用的比例
#   no_hyperlinks        {}
#   no_ascii_art         {}
#   tool_discipline      {}                 没有同时含正文和 tool_calls 的 AIMessage
#   no_leading_header    {}
#   latex_sanity         {}                 \( \) 或 \[ \],不用 $;普通数字不包 LaTeX
#   no_prompt_leak       {}                 core.prompt_guard.has_prompt_leakage
#   response_language    {expect}           回答语言是否为 zh/en;expect 缺省由 case 推导
#
# ── 语言期望 ────────────────────────────────────────────────────────────────
# case 的 `lang` = **query 写的语言**;`expect_lang` = 回答**应该**用的语言。
# 二者通常相同,不同的情况是 personalization 显式指定了 Response language ——
# PRO_PROMPT 要求「Honour it silently」,所以那时 personalization 赢。
# case 里写 `personalization: {language: null}` 可以把这一行从 XML 块里去掉,
# 于是模型只能从 query 本身推断语言,这正是 language suite 要测的。
#
# ── judge 契约 ──────────────────────────────────────────────────────────────
#   - {key, prompt, weight, pass_at}
# judge 每项打 0/1/2,pass_at 缺省 2(即满分才算通过)。
#
# 另有一个 case 级开关 `citation_grounding: true` —— 打开后对每条被引用的句子
# 单独判一次「[n] 对应的来源原文是否真的支持这句话」(见 PLAN.md §3.6 L4)。
# 用的是 trace 里完整的 ToolMessage 原文,不是 registry 里的截断摘要。
# 成本较高,只在 web-research / report-writing 上开。

version: 1

defaults:
  mode: pro
  lang: zh
  repeats: 2
  timeout_s: 300
  judge_pass_at: 2

  # 写死,否则「今年」「最近」类问题跨天不可复现
  personalization:
    language: 简体中文
    location: Champaign, Illinois, US
    datetime: "2026-08-02T10:00:00-05:00"

  # 合到每个 case 上;case 里写 `disable: [key, ...]` 可单独关掉某项。
  #
  # 全部显式 turn: all —— 这些都是 PRO_PROMPT 里对「每一轮」成立的硬约束
  # (不是只对最后一轮),默认的 turn: last 会让多轮 case(guided-learning、
  # trip-advisor)的第 0 轮完全逃过这些检查,和之前 skill_loaded:guided-learning
  # 那个 bug 是同一类问题。single-turn case 不受影响(all == last)。
  #
  # 三个新增(citation_coverage / latex_sanity / search_discipline)之前只在
  # 少数 case 里手动加过,但对应的 PRO_PROMPT 规则("工具事实必须引用"、
  # "LaTeX 只用于真公式"、"每个子话题最多 2 次 google_search")本就是普适的硬
  # 约束,三个 check 在不适用时都会安全地判过(见 checks.py 里各自的实现),
  # 提到 common 上不会误伤不涉及检索/数学的 case。
  common_checks:
    - {key: tool_discipline,   weight: 2, turn: all}
    - {key: no_hyperlinks,     weight: 2, turn: all}
    - {key: no_ascii_art,      weight: 2, turn: all}
    - {key: citation_exists,   weight: 3, turn: all}
    - {key: citation_format,   weight: 2, turn: all}
    - {key: citation_coverage, args: {min_ratio: 0.6}, turn: all}
    - {key: no_leading_header, weight: 1, turn: all}
    - {key: latex_sanity,      weight: 2, turn: all}
    - {key: search_discipline, args: {max_per_topic: 2}, weight: 2, turn: all}
    - {key: no_prompt_leak,    weight: 3, turn: all}
    - {key: response_language, weight: 2, turn: all}

# ═══════════════════════════════════════════════════════════════════════════
# web-research
# ═══════════════════════════════════════════════════════════════════════════
cases:
  - id: web-research/sea-lions-vs-seals
    suite: web-research
    skill: web-research
    title: 深度研究海狮与海豹的区别
    citation_grounding: true
    turns:
      - text: 深度研究一下海狮和海豹的区别
    checks:
      - {key: skill_loaded,      args: {skill: web-research},   weight: 3}
      - {key: skill_loaded,      args: {skill: charting},       weight: 2}
      - {key: skill_loaded,      args: {skill: report-writing}, weight: 2}
      - {key: skill_load_order,  args: {before: web-research, after: report-writing}, weight: 1}
      - {key: tool_called,       args: {tool: google_search, min: 3, max: 12}, weight: 2}
      - {key: tool_called,       args: {tool: load_web_page, min: 2, max: 12}, weight: 2}
      - {key: distinct_queries,  args: {tool: google_search, min: 3}, weight: 2}
      - {key: distinct_domains,  args: {min: 3}}
      - {key: has_report,        args: {min_words: 800, require_title: true}, weight: 3}
      - {key: chart_count,       args: {min: 2}, weight: 3}
      - {key: charts_valid,      args: {require_palette: true, min_series: 1}, weight: 2}
      - {key: citation_count,    args: {min: 6}, weight: 2}
      - {key: citation_coverage, args: {min_ratio: 0.7}}
    judge:
      - key: answers_question
        weight: 3
        prompt: >-
          Does the report directly and completely answer "the difference between sea lions and seals"? Does it cover the core dimensions: external ear flaps, fore/hind limbs and locomotion, size, habitat and taxonomy?
      - key: research_arc
        weight: 2
        prompt: >-
          Does the tool trace show a research arc — orient (one broad survey), dive (several distinct sub-topics), compare (an explicit synthesis) — rather than a flat sequence of near-identical searches?
      - key: substance
        weight: 3
        prompt: >-
          Does the content give specific facts, figures and species names rather than generalities? Are there verifiable details, or is it restating common knowledge?
      - key: chart_relevance
        weight: 2
        prompt: >-
          Do the charts carry real data relevant to the argument, drawn from the retrieved sources rather than invented? Score 0 for purely decorative charts.

  - id: web-research/solid-state-batteries
    suite: web-research
    skill: web-research
    title: 固态电池现状(英文 query,个性化要求英文回答)
    lang: en
    personalization: {language: English}
    citation_grounding: true
    turns:
      - text: Research the current state of solid-state battery commercialization in 2026.
    checks:
      - {key: skill_loaded,     args: {skill: web-research}, weight: 3}
      - {key: skill_loaded,     args: {skill: report-writing}, weight: 2}
      - {key: tool_called,      args: {tool: google_search, min: 3, max: 12}, weight: 2}
      - {key: distinct_domains, args: {min: 3}}
      - {key: has_report,       args: {min_words: 900, require_title: true}, weight: 3}
      - {key: chart_count,      args: {min: 1}, weight: 2}
      - {key: charts_valid,     args: {require_palette: true}}
      - {key: citation_count,   args: {min: 6}, weight: 2}
    judge:
      - key: answers_question
        weight: 3
        prompt: >-
          Does the report actually characterize the *current* state of commercialization (players, timelines, remaining blockers), rather than explaining what solid-state batteries are?
      - key: recency
        weight: 3
        prompt: >-
          Does the report use 2025-2026 information? Score low if it leans heavily on older data without saying so.
      - key: disagreement
        weight: 1
        prompt: >-
          Where sources disagree (e.g. on mass-production timelines), does the report surface the disagreement rather than silently picking one?

  - id: web-research/ambiguous-scope
    suite: web-research
    skill: web-research
    title: 模糊范围应先澄清
    lang: en
    personalization: {language: English}
    turns:
      - text: Look into that new model that just came out.
    checks:
      - {key: question_block, args: {min_q: 1, max_q: 3, must_be_last: true}, weight: 3}
      - {key: skill_loaded,   args: {skill: ask-question}, weight: 2}
      - {key: no_report,      weight: 3}
      - {key: tool_called,    args: {tool: google_search, min: 0, max: 1}, weight: 2}
    judge:
      - key: asks_right_thing
        weight: 3
        prompt: >-
          Do the clarifying questions target what is genuinely unknown (which model, which domain, which aspect) rather than things that could reasonably be assumed?

# ═══════════════════════════════════════════════════════════════════════════
# report-writing
# ═══════════════════════════════════════════════════════════════════════════
  - id: report-writing/explicit-request
    suite: report-writing
    skill: report-writing
    title: 明确要求写报告
    citation_grounding: true
    turns:
      - text: 写一份关于远程办公对软件团队生产力影响的报告
    checks:
      - {key: skill_loaded, args: {skill: report-writing}, weight: 3}
      - {key: has_report,   args: {min_words: 600, require_title: true}, weight: 3}
      - {key: tool_called,  args: {tool: google_search, min: 2, max: 10}, weight: 2}
      - {key: citation_count, args: {min: 4}, weight: 2}
    judge:
      - key: structure
        weight: 2
        prompt: >-
          Does the report have a clear structure (overview / sub-topics / conclusion) with sensible heading levels, rather than one undifferentiated block of prose?
      - key: substance
        weight: 3
        prompt: >-
          Is it backed by specific studies, data or cases, rather than empty both-sidesing?

  - id: report-writing/no-report-needed
    suite: report-writing
    skill: report-writing
    title: 简单问题不该写报告(负例)
    is_negative: true
    lang: en
    personalization: {language: English}
    turns:
      - text: What is the TCP three-way handshake?
    checks:
      - {key: no_report,        weight: 3}
      - {key: word_count,       args: {min: 80, max: 450}, weight: 3}
      - {key: chart_count,      args: {max: 0}, weight: 2}
      - {key: skill_not_loaded, args: {skill: web-research}, weight: 2}
    judge:
      - key: answers_question
        weight: 3
        prompt: >-
          Does it clearly explain the three steps (SYN / SYN-ACK / ACK) and what the handshake is for?
      - key: right_sized
        weight: 3
        prompt: >-
          Is the length proportionate to the question? For a standard textbook concept, producing a long report or forcing in a chart is overkill — score 0 for that.

# ═══════════════════════════════════════════════════════════════════════════
# charting
# ═══════════════════════════════════════════════════════════════════════════
  - id: charting/revenue-comparison
    suite: charting
    skill: charting
    title: 营收对比应出图
    lang: en
    personalization: {language: English}
    turns:
      - text: Compare Nvidia and AMD's revenue over the past five years.
    checks:
      - {key: skill_loaded,  args: {skill: charting}, weight: 3}
      - {key: chart_count,   args: {min: 1}, weight: 3}
      - {key: charts_valid,  args: {require_palette: true, min_series: 2}, weight: 3}
      - {key: no_ascii_art,  weight: 3}
      - {key: tool_called,   args: {tool: google_search, min: 1, max: 6}, weight: 2}
      - {key: citation_count, args: {min: 2}, weight: 2}
      - {key: word_count,    args: {min: 100, max: 800}}
    judge:
      - key: chart_data_real
        weight: 3
        prompt: >-
          Do the revenue figures in the chart come from the retrieved results? Check them against the tool output; score 0 if they are invented or off by an order of magnitude.
      - key: chart_type_fit
        weight: 2
        prompt: >-
          Is the chart type appropriate for a five-year, two-company trend comparison (line or bar are; a pie chart is not)?

  - id: charting/no-chart-needed
    suite: charting
    skill: charting
    title: 一句话问题不该出图(负例)
    is_negative: true
    turns:
      - text: 用一句话解释光合作用
    checks:
      - {key: chart_count, args: {max: 0}, weight: 3}
      - {key: no_report,   weight: 3}
      - {key: word_count,  args: {min: 10, max: 120}, weight: 3}
    judge:
      - key: obeys_constraint
        weight: 3
        prompt: >-
          Did it actually answer in one sentence? Multiple paragraphs means the instruction was not followed — score 0.

# ═══════════════════════════════════════════════════════════════════════════
# mapping
# ═══════════════════════════════════════════════════════════════════════════
  - id: mapping/ramen-chicago
    suite: mapping
    skill: mapping
    title: 推荐地点应出地图
    lang: en
    personalization: {language: English}
    turns:
      - text: Recommend five great ramen spots in downtown Chicago.
    checks:
      - {key: skill_loaded, args: {skill: mapping}, weight: 3}
      - {key: tool_called,  args: {tool: google_search_places, min: 1, max: 5}, weight: 3}
      - {key: map_fence,    args: {min: 1, max_pins: 8}, weight: 3}
      - {key: word_count,   args: {min: 100, max: 700}}
      - {key: no_report,    weight: 2}
    judge:
      - key: places_real
        weight: 3
        prompt: >-
          Do the recommended restaurants come from the google_search_places results? Any name absent from the tool output is fabricated — score 0.
      - key: pins_match_text
        weight: 2
        prompt: >-
          Do the map pins correspond one-to-one with the restaurants recommended in the prose? Score low if the counts or names do not match.

  - id: mapping/no-map-needed
    suite: mapping
    skill: mapping
    title: 地理常识不该出地图(负例)
    is_negative: true
    turns:
      - text: 东京在南半球还是北半球?
    checks:
      - {key: no_map,     weight: 3}
      - {key: word_count, args: {min: 5, max: 150}, weight: 2}
      - {key: no_report,  weight: 2}

# ═══════════════════════════════════════════════════════════════════════════
# ask-question
# ═══════════════════════════════════════════════════════════════════════════
  - id: ask-question/laptop-choice
    suite: ask-question
    skill: ask-question
    title: 选购需求应先提问
    lang: en
    personalization: {language: English}
    turns:
      - text: Help me pick a laptop.
    checks:
      - {key: skill_loaded,   args: {skill: ask-question}, weight: 3}
      - {key: question_block, args: {min_q: 1, max_q: 3, must_be_last: true}, weight: 3}
      - {key: no_report,      weight: 2}
    judge:
      - key: question_quality
        weight: 3
        prompt: >-
          Do the questions target the decisive trade-offs (budget, intended use, OS preference, portability)? Score low for irrelevant or self-evident questions.
      - key: options_sane
        weight: 2
        prompt: >-
          Are the options mutually exclusive, covering the common cases, and concisely worded?

  - id: ask-question/no-question-needed
    suite: ask-question
    skill: ask-question
    title: 信息充分不该提问(负例)
    is_negative: true
    turns:
      - text: 纽约今天天气怎么样?
    checks:
      - {key: no_question_block, weight: 3}
      - {key: tool_called,       args: {tool: get_weather, min: 1, max: 2}, weight: 3}
      - {key: no_report,         weight: 2}
      - {key: word_count,        args: {min: 20, max: 300}}

# ═══════════════════════════════════════════════════════════════════════════
# guided-learning(多轮)
# ═══════════════════════════════════════════════════════════════════════════
  - id: guided-learning/fourier-transform
    suite: guided-learning
    skill: guided-learning
    title: 教学:傅里叶变换
    turns:
      - text: 教我一下傅里叶变换
      - text: 我是理工科大二学生,学过微积分和线性代数,想搞懂它的直觉而不是推导。目标是理解信号处理里为什么要用它。
    checks:
      - {key: skill_loaded,   args: {skill: guided-learning}, turn: any, weight: 3}
      - {key: question_block, args: {min_q: 1, max_q: 3, must_be_last: true}, turn: 0, weight: 3}
      - {key: no_report,      turn: 0, weight: 2}
      - {key: chart_count,    args: {min: 1}, turn: 1, weight: 2}
      - {key: charts_valid,   args: {require_palette: true}, turn: 1, weight: 2}
      - {key: word_count,     args: {min: 500}, turn: 1, weight: 2}
      - {key: latex_sanity,   turn: 1, weight: 2}
    judge:
      - key: calibration
        weight: 3
        prompt: >-
          Is the second-turn explanation calibrated to the level the learner stated (second-year STEM, has calculus and linear algebra, wants intuition not derivation)? Score 0 if it delivers a generic lecture, starts from zero, or goes straight into rigorous proofs.
      - key: concept_order
        weight: 2
        prompt: >-
          Is the material broken into 2-4 core concepts ordered by dependency (A established before B is explained in terms of A)?
      - key: has_interaction
        weight: 2
        prompt: >-
          Does it include something that checks understanding (a quiz, an exercise, or self-check questions)?

  - id: guided-learning/quiz-probability
    suite: guided-learning
    skill: guided-learning
    title: 出题模式:高中概率
    lang: en
    personalization: {language: English}
    turns:
      - text: Quiz me on high school probability — give me a few questions first.
    checks:
      - {key: skill_loaded, args: {skill: guided-learning}, turn: any, weight: 2}
      - {key: word_count,   args: {min: 150, max: 1200}}
      - {key: no_report,    weight: 2}
    judge:
      - key: is_quiz
        weight: 3
        prompt: >-
          Does it actually pose questions for the user to answer, rather than lecturing or answering its own questions?
      - key: difficulty_fit
        weight: 2
        prompt: >-
          Are the questions within high-school probability (classical probability, conditional probability, independence) rather than university-level material?

# ═══════════════════════════════════════════════════════════════════════════
# trip-advisor(多轮)
# ═══════════════════════════════════════════════════════════════════════════
  - id: trip-advisor/japan-7d
    suite: trip-advisor
    skill: trip-advisor
    title: 日本七日行程
    timeout_s: 420
    turns:
      - text: 帮我规划一下十月去日本七天的行程
      - text: |
          从芝加哥出发,10月12日去10月19日回。东京进大阪出,两个人,情侣。
          预算总共一万美元,中档偏好。喜欢美食和历史古迹,不爱夜生活。
          没有饮食禁忌,想去一次环球影城。
    checks:
      # Step 0 是 mandatory:第一轮必须只提问,过早出行程即为没遵循流程
      - {key: skill_loaded,   args: {skill: trip-advisor}, turn: 0, weight: 3}
      - {key: skill_loaded,   args: {skill: ask-question}, turn: 0, weight: 3}
      - {key: question_block, args: {min_q: 1, max_q: 8, must_be_last: true}, turn: 0, weight: 3}
      - {key: no_report,      turn: 0, weight: 3}
      # 第二轮才是正式产出
      - {key: has_report,     args: {min_words: 1000, require_title: true}, turn: 1, weight: 3}
      - {key: map_fence,      args: {min: 1, max_pins: 8}, turn: 1, weight: 2}
      - {key: tool_called,    args: {tool: google_search, min: 3, max: 15}, turn: 1, weight: 2}
      - {key: citation_count, args: {min: 4}, turn: 1, weight: 2}
    judge:
      - key: honors_constraints
        weight: 3
        prompt: >-
          Does the itinerary honour every constraint the user gave (into Tokyo out of Osaka, Oct 12-19, two travellers, $10k budget, mid-range, food and historic sites, no nightlife, includes Universal Studios)? Missing any hard constraint scores 0.
      - key: itinerary_feasible
        weight: 3
        prompt: >-
          Is the day-by-day plan geographically and temporally feasible (no single day spanning hundreds of kilometres, inter-city travel accounted for)?
      - key: budget_realistic
        weight: 2
        prompt: >-
          Does it give a cost breakdown against the $10k budget, with plausible magnitudes?

  - id: trip-advisor/weekend-nyc
    suite: trip-advisor
    skill: trip-advisor
    title: 纽约周末短途
    lang: en
    personalization: {language: English}
    turns:
      - text: I want to visit New York for two days next weekend, help me plan it.
      - text: Taking the train from Boston, traveling solo, budget is $600, mainly want to visit museums and eat good food.
    checks:
      - {key: question_block, args: {min_q: 1, max_q: 8, must_be_last: true}, turn: 0, weight: 3}
      - {key: no_report,      turn: 0, weight: 3}
      - {key: has_report,     args: {min_words: 400}, turn: 1, weight: 2}
      - {key: map_fence,      args: {min: 1, max_pins: 8}, turn: 1, weight: 2}
    judge:
      - key: scaled_to_trip
        weight: 3
        prompt: >-
          Is the two-day plan scaled down proportionately rather than a seven-day template crammed into two days? Is any day obviously overloaded?

# ═══════════════════════════════════════════════════════════════════════════
