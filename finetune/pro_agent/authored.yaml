  rs-11: |
    "画蛇添足" (huà shé tiān zú) literally means "to draw a snake and add feet to it." It comes from a story about a man who won a drawing contest, then lost it by continuing to embellish a snake that was already finished.

    In English it means to spoil something by adding what wasn't needed. The closest idiomatic equivalents are "to gild the lily" or, more plainly, "to overdo it."

  rs-12: |
    「辛苦了」(xīnkǔ le) acknowledges that someone has put in real effort — roughly "thanks for your hard work" or "you've worked hard."

    It doesn't translate literally, and English has no exact equivalent. At the end of a work message it reads as warm and routine rather than as formal praise, so "thanks for all your work on this" is usually the closest natural rendering.

