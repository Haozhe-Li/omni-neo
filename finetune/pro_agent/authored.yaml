  wr-26: |
    草稿如下：

    <textblock type="email" subject="感谢昨日的面试机会（数据分析岗）">
    您好，

    感谢您昨天下午抽出时间与我交流。

    这次沟通让我对贵司数据分析岗位的具体工作内容和团队的协作方式有了更清晰的了解，也让我更希望能有机会加入。如果后续需要我补充任何材料，请随时告诉我。

