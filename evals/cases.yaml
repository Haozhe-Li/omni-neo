        weight: 2
        prompt: >-
          Is the email's tone polite and appropriate enough to send as-is?
      - key: separation
        weight: 3
        prompt: >-
          Does it cleanly separate its own remarks from the deliverable (one line of commentary, the email fenced by --- rules, then a single follow-up question)?

  - id: general/chitchat
