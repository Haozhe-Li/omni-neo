# 手写的教师答案 —— 用于 luna 产不出稳定示范的那些 query
#
# ## 为什么这些不走 collect.py
#
# `write-rewrite` 的翻译子类是零工具调用的确定性交付物:没有检索、没有推理链
# 需要蒸馏,一条轨迹里唯一有信息量的就是最终那段文本。而 luna 在这一类上对
# `_S_WRITING_FORMAT` 的遵守率只有 50% —— 实测 8 条里 4 条(wr-14/16/17/18)
# 直接以 `<textblock>` 开头,漏掉了契约要求的前置短评,且漏的方式有规律
# (源文本是外语时更容易漏)。类别 check 抓不到这个,因为 `textblock` /
# `followup_question` / `no_tool_calls` 三条都不管块前面有没有东西。
#
# 教一个 50% 合规的示范,模型学到的是「那行可有可无」—— prompt 说要、数据说
# 随意,这种矛盾信号正是让微调漂移的东西。手写在这里严格优于采集。
#
# ## 这不等于免检
#
# `author.py` 把这些答案套进**生产的** user message 和**真实装配的** system
# prompt,再跑一遍与采集完全相同的 gate + 类别 check,任何一条不过就拒绝写入。
# 手写的是答案,不是判定。
#
# ## 什么该写在这里,什么不该
#
# 只写零工具调用、且正确答案唯一或近乎唯一的 query。需要检索的一律走 luna ——
# 手写检索型答案等于凭空捏造工具结果和引用编号,那是在教模型幻觉。
#
# 契约(_S_WRITING_FORMAT + _S_FOLLOWUP),下面每条都严格遵守:
#   一行短评 / 空行 / <textblock>…</textblock> / 空行 / 一句追问
#   块内只有成品文本 —— 无 markdown、无引用标记、无「我改了什么」的说明
#   散文用**指令**语种,块内用**目标**语种,追问回到指令语种
#   邮件额外带 type="email" 和 subject="…",subject 内不得出现双引号

